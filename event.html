    .popup-box {

      window.BABDODUK_STR = STR;
      function applyLang(lang) {
        if (lang !== 'en') lang = 'ko';
        document.documentElement.lang = lang;
        try { localStorage.setItem('babdoduk-lang', lang); } catch (e) {}
        var T = STR[lang];
        document.title = T.docTitle;
        document.querySelectorAll('[data-i18n]').forEach(function (el) {
          var k = el.getAttribute('data-i18n');
          if (T[k] !== undefined) el.textContent = T[k];
        });
        document.querySelectorAll('[data-i18n-html]').forEach(function (el) {
          var k = el.getAttribute('data-i18n-html');
          if (T[k] !== undefined) el.innerHTML = T[k];
        });
        document.querySelectorAll('[data-i18n-aria-key]').forEach(function (el) {
          var k = el.getAttribute('data-i18n-aria-key');
          if (T[k] !== undefined) el.setAttribute('aria-label', T[k]);
        });
        var navInner = document.getElementById('siteNavInner');
        if (navInner && T['nav.navAria']) navInner.setAttribute('aria-label', T['nav.navAria']);
        var sp = document.getElementById('scrollProgressWrap');
        if (sp && T['a11y.scrollProgress']) sp.setAttribute('aria-label', T['a11y.scrollProgress']);
      }
      window.babdodukApplyLang = applyLang;
      window.babdodukGetLang = function () {
        return document.documentElement.lang === 'en' ? 'en' : 'ko';
      };
      var saved = 'ko';
      try { saved = localStorage.getItem('babdoduk-lang') || 'ko'; } catch (e) {}
      applyLang(saved === 'en' ? 'en' : 'ko');
      var langBtnEl = document.getElementById('langToggle');
      if (langBtnEl) {
        langBtnEl.addEventListener('click', function () {
          applyLang(window.babdodukGetLang() === 'ko' ? 'en' : 'ko');
        });
      }
    })();

  <script>
    (function () {
      var bar = document.getElementById('scrollProgressBar');
      var wrap = bar && bar.parentElement;
      function onScroll() {
        if (!bar) return;
        var el = document.documentElement;
        var total = el.scrollHeight - el.clientHeight;
        var pct = total <= 0 ? 0 : (el.scrollTop / total) * 100;
        bar.style.width = pct + '%';
        if (wrap) wrap.setAttribute('aria-valuenow', String(Math.round(pct)));
      }
      window.addEventListener('scroll', onScroll, { passive: true });
      window.addEventListener('resize', onScroll);
      onScroll();

      function shouldShowWelcome() {
        var path = (location.pathname || '').toLowerCase();
        if (path.indexOf('food.html') !== -1 || path.indexOf('event.html') !== -1) return false;
        try {
          var until = localStorage.getItem('babdoduk-welcome-snooze-until');
          if (until && Date.now() < parseInt(until, 10)) return false;
        } catch (err) {}
        return true;
      }
      var popup = document.getElementById('welcomePopup');
      var closeBtn = document.getElementById('popupCloseBtn');
      var snoozeBtn = document.getElementById('popupSnoozeBtn');
      function openPopup() {
        popup.classList.add('is-open');
        popup.setAttribute('aria-hidden', 'false');
      }
      function closePopup(withSnooze24h) {
        popup.classList.remove('is-open');
        popup.setAttribute('aria-hidden', 'true');
        try {
          if (withSnooze24h) {
            var until = Date.now() + 24 * 60 * 60 * 1000;
            localStorage.setItem('babdoduk-welcome-snooze-until', String(until));
          }
        } catch (err) {}
      }
      if (shouldShowWelcome()) requestAnimationFrame(function () { openPopup(); });
      if (closeBtn) closeBtn.addEventListener('click', function () { closePopup(false); });
      if (snoozeBtn) snoozeBtn.addEventListener('click', function () { closePopup(true); });
      popup.addEventListener('click', function (e) {
        if (e.target === popup) closePopup(false);
      });
    })();
  </script>

  <script>
    (function () {
      var tabs = [].slice.call(document.querySelectorAll('.event-tab'));
      var panels = [].slice.call(document.querySelectorAll('.event-panel'));
      function select(i) {
        tabs.forEach(function (tab, j) {
          var on = j === i;
          tab.setAttribute('aria-selected', on ? 'true' : 'false');
          tab.tabIndex = on ? 0 : -1;
          panels[j].classList.toggle('is-active', on);
          if (on) panels[j].removeAttribute('hidden');
          else panels[j].setAttribute('hidden', '');
        });
      }
      tabs.forEach(function (tab, i) {
        tab.addEventListener('click', function () { select(i); });
      });
    })();
  </script>
