name: e2e-live

# Stage 1 of the end-to-end checks, run once per deploy (owner 2026-10-15: whenever the service is
# developed, not daily). A push to main or lab first waits for the Vercel deployment of that exact
# commit to succeed, then a real Chromium opens the site that branch deploys (main: production, lab:
# babdoduk-lab) like a visitor (Korean and English, phone and desktop) and walks the journeys in
# scripts/e2e_live.py: home, 꽁밥, magazine/events/history, the 먹방 월드컵, links, images, console
# errors and load times. A failure makes the run red, so GitHub emails the owner.
# Pushes of the content bot touch only generated data (scripts/publish_generated.py) and are ignored.
# Strictly read-only: no secrets, no writes, no deploy. The script aborts every non-GET request in
# the browser (the world cup's stats RPC on lab included) and never touches Dooray or the Portal.
# workflow_dispatch can still run either site (or both) by hand.

on:
  push:
    branches: [main, lab]
    paths-ignore:
      - 'data/magazine/**'
      - 'data/kaist-menu/**'
      - 'data/ggongbab/**'
      - 'research/**'
  workflow_dispatch:
    inputs:
      target:
        description: 'Which site to check (quality: stage 4 accessibility, links and performance of both sites)'
        type: choice
        options: [both, prod, lab, quality]
        default: both

permissions:
  contents: read
  statuses: read          # the commit status that tells when the Vercel deployment succeeded

concurrency:
  group: e2e-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONIOENCODING: utf-8
      # A push checks only the site its branch deploys; a manual run takes its input.
      TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || (github.ref_name == 'main' && 'prod' || 'lab') }}
    steps:
      - name: Wait for the Vercel deployment of this commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_CONTEXT: ${{ github.ref_name == 'main' && 'Vercel – babdoduk' || 'Vercel – babdoduk-lab' }}
        run: |
          deadline=$((SECONDS + 900))
          state=none
          while [ "$SECONDS" -lt "$deadline" ]; do
            state=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/status" \
              --jq ".statuses[] | select(.context == \"$VERCEL_CONTEXT\") | .state" | head -n 1)
            state=${state:-none}
            echo "$VERCEL_CONTEXT: $state"
            case "$state" in
              success) exit 0 ;;
              failure|error) echo "::error::$VERCEL_CONTEXT reported $state for ${{ github.sha }}; the deployment failed, so there is nothing to check."; exit 1 ;;
            esac
            sleep 20
          done
          echo "::error::Timed out after 15 minutes waiting for $VERCEL_CONTEXT to succeed for ${{ github.sha }} (last state: $state)."
          exit 1
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Playwright and its Chromium
        run: |
          python -m pip install --no-cache-dir playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Production
        id: prod
        if: env.TARGET == 'both' || env.TARGET == 'prod'
        continue-on-error: true
        run: python scripts/e2e_live.py --base https://babdoduk.vercel.app --out .local/e2e-live
      - name: Lab
        id: lab
        if: env.TARGET == 'both' || env.TARGET == 'lab'
        continue-on-error: true
        run: python scripts/e2e_live.py --base https://babdoduk-lab.vercel.app --out .local/e2e-live
      - name: Quality (accessibility, links, performance), production
        id: qprod
        if: env.TARGET == 'quality'
        continue-on-error: true
        run: python scripts/e2e_quality.py --base https://babdoduk.vercel.app --out .local/e2e-live
      - name: Quality (accessibility, links, performance), lab
        id: qlab
        if: env.TARGET == 'quality'
        continue-on-error: true
        run: python scripts/e2e_quality.py --base https://babdoduk-lab.vercel.app --out .local/e2e-live
      - name: Upload reports and failure screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-live-${{ github.run_id }}
          path: .local/e2e-live/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
      - name: Fail the run if any site failed
        if: steps.prod.outcome == 'failure' || steps.lab.outcome == 'failure' || steps.qprod.outcome == 'failure' || steps.qlab.outcome == 'failure'
        run: |
          echo "production: ${{ steps.prod.outcome }}, lab: ${{ steps.lab.outcome }}"
          exit 1
