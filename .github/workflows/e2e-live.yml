name: e2e-live

# Stage 1 of the end-to-end checks: every morning (07:30 KST) a real Chromium opens the deployed
# production site and babdoduk-lab like a visitor (Korean and English, phone and desktop) and walks
# the journeys in scripts/e2e_live.py: home, 꽁밥, magazine/events/history, the 먹방 월드컵, links,
# images, console errors and load times. A failure makes the run red, so GitHub emails the owner.
# Strictly read-only: no secrets, no writes, no deploy. The script aborts every non-GET request in
# the browser (the world cup's stats RPC on lab included) and never touches Dooray or the Portal.
# Schedules run only from the default branch (main).

on:
  schedule:
    - cron: '30 22 * * *'   # 07:30 KST
  workflow_dispatch:
    inputs:
      target:
        description: 'Which site to check'
        type: choice
        options: [both, prod, lab]
        default: both

permissions:
  contents: read

concurrency:
  group: e2e-live
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONIOENCODING: utf-8
      TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'both' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Playwright and its Chromium
        run: |
          python -m pip install --no-cache-dir playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Production
        id: prod
        if: env.TARGET == 'both' || env.TARGET == 'prod'
        continue-on-error: true
        run: python scripts/e2e_live.py --base https://babdoduk.vercel.app --out .local/e2e-live
      - name: Lab
        id: lab
        if: env.TARGET == 'both' || env.TARGET == 'lab'
        continue-on-error: true
        run: python scripts/e2e_live.py --base https://babdoduk-lab.vercel.app --out .local/e2e-live
      - name: Upload reports and failure screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-live-${{ github.run_id }}
          path: .local/e2e-live/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
      - name: Fail the run if any site failed
        if: steps.prod.outcome == 'failure' || steps.lab.outcome == 'failure'
        run: |
          echo "production: ${{ steps.prod.outcome }}, lab: ${{ steps.lab.outcome }}"
          exit 1
