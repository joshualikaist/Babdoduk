name: magazine-daily

# Cron runs only from the default branch (main). Keep this file on main.
# The job always writes today's edition to lab and makes it index.json latest.

on:
  schedule:
    - cron: '0 1 * * *' # 10:00 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch public feeds
        run: python scripts/refresh_magazine.py
      - name: Commit edition as latest
        run: |
          git config user.name "babdoduk-magazine-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/magazine
          if git diff --staged --quiet; then
            echo "No magazine changes"
            exit 0
          fi
          git commit -m "magazine: 10:00 KST edition refresh"
          git pull --rebase origin lab
          git push origin lab
