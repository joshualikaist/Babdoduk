name: content-refresh

# Cron only runs from the default branch (main). Keep this file on main.
# Generated JSON is copied onto lab and main. Feature code is never merged by this job.

on:
  # Off the hour and the half hour, where GitHub delays or drops scheduled runs (2026-10-12: the
  # 10:00 KST run started at 15:44 and the 10:30 KST run never started). A scheduled run builds
  # the magazine only while today's edition is missing (--if-missing), so the first one that
  # starts publishes it and the later ones are backups. A manual run always rebuilds.
  schedule:
    - cron: '47 20 * * *' # 05:47 KST  KAIST menu
    - cron: '7 1 * * *'   # 10:07 KST  magazine, KAIST menu
    - cron: '53 1 * * *'  # 10:53 KST  backup magazine, KAIST menu
    - cron: '23 3 * * *'  # 12:23 KST  backup magazine, KAIST menu
    - cron: '17 7 * * *'  # 16:17 KST  KAIST menu, backup magazine
  workflow_dispatch:
    inputs:
      target:
        description: magazine, kaist, or both
        default: both
        type: choice
        options:
          - both
          - magazine
          - kaist

concurrency:
  group: babdoduk-content-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    # Main only, like the free-food job: generators run the code of the ref they start from and
    # the publisher mirrors that output into lab and main, so a dispatch from any other branch or
    # tag must not run. A hung source cannot hold the shared concurrency group for hours.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Choose jobs
        id: pick
        env:
          TARGET: ${{ github.event.inputs.target }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          mag=0
          kaist=0
          once=0
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            case "${TARGET:-both}" in
              magazine) mag=1 ;;
              kaist) kaist=1 ;;
              *) mag=1; kaist=1 ;;
            esac
          else
            case "${SCHEDULE}" in
              '47 20 * * *') kaist=1 ;;
              *) mag=1; kaist=1; once=1 ;;
            esac
          fi
          echo "magazine=${mag}" >> "$GITHUB_OUTPUT"
          echo "kaist=${kaist}" >> "$GITHUB_OUTPUT"
          echo "once=${once}" >> "$GITHUB_OUTPUT"
      - name: Refresh magazine
        if: steps.pick.outputs.magazine == '1'
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ONCE: ${{ steps.pick.outputs.once }}
        run: |
          if [ "$ONCE" = "1" ]; then
            python scripts/refresh_magazine.py --if-missing
          else
            python scripts/refresh_magazine.py
          fi
      - name: Refresh KAIST menu
        if: steps.pick.outputs.kaist == '1'
        run: |
          set +e
          python scripts/refresh_kaist_menu.py
          code=$?
          if [ "$code" -eq 2 ]; then
            echo "KAIST produced no restaurants; keeping previous files"
            exit 0
          fi
          exit "$code"
      # Only the families this run refreshed: another family's data cannot block this publish.
      - name: Validate generated JSON
        run: |
          families=()
          if [ "${{ steps.pick.outputs.magazine }}" = "1" ]; then
            families+=(magazine)
          fi
          if [ "${{ steps.pick.outputs.kaist }}" = "1" ]; then
            families+=(kaist-menu)
          fi
          if [ "${#families[@]}" -eq 0 ]; then
            echo "nothing to validate"
            exit 0
          fi
          python scripts/validate_content.py --only "${families[@]}"
      - name: Publish generated data to lab and main
        env:
          GIT_TERMINAL_PROMPT: 0
        run: |
          paths=()
          if [ "${{ steps.pick.outputs.magazine }}" = "1" ]; then
            paths+=(data/magazine research/magazine)
          fi
          if [ "${{ steps.pick.outputs.kaist }}" = "1" ]; then
            paths+=(data/kaist-menu)
          fi
          if [ "${#paths[@]}" -eq 0 ]; then
            echo "nothing to publish"
            exit 0
          fi
          python scripts/publish_generated.py --paths "${paths[@]}" --message "content: generated data refresh"
