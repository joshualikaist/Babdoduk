name: tests

# The repository's own gates on every pull request and every code push (data-only content-bot
# commits do not run it):
#   pytest            the whole suite, synthetic data only; the browser tests use the runner's
#                     Google Chrome, as on the owner's PC
#   validate_content  every committed family, each file against its contract in schemas/
#   chrome sync       every page's nav/footer copy matches shared/
# The chrome screenshot comparison at the end of the site guardian is skipped here: its baselines
# exist only for the pinned container (linux-chromium) and the owner's PC (windows-chrome), and
# ui-guardian's visual job compares them in the container they were rendered in.
# Read-only: no secrets, no writes, no deploy, no schedule.

on:
  pull_request:
  push:
    branches: [main, lab, 'agent/**', 'release/**']
    paths-ignore:
      - 'data/**'
      - 'research/**'

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BABDODUK_CHROME_VISUAL: skip
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install the test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test suite
        run: python -m pytest tests -q
      - name: Committed generated data validates
        run: python scripts/validate_content.py
      - name: Shared nav, footer and chrome strings are in sync
        run: python scripts/sync_site_chrome.py --check
