name: site-chrome

# Every page carries a static copy of shared/nav.html and shared/footer.html
# (scripts/sync_site_chrome.py). Fail when any page drifts from the shared source.
# Read-only: no secrets, no writes, no deploy. Data-only bot pushes do not trigger it.

on:
  push:
    branches: [main, lab, 'agent/**', 'release/**']
    paths:
      - '**.html'
      - 'shared/**'
      - 'scripts/sync_site_chrome.py'
      - '.github/workflows/site-chrome.yml'
  pull_request:
    paths:
      - '**.html'
      - 'shared/**'
      - 'scripts/sync_site_chrome.py'
      - '.github/workflows/site-chrome.yml'

permissions:
  contents: read

jobs:
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Shared nav and footer are in sync
        run: python scripts/sync_site_chrome.py --check
