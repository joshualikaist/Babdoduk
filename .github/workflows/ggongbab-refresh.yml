name: ggongbab-refresh

# Cron only runs from the default branch (main). Keep this file on main.
# Collects KAIST free-food events (Dooray tasks + KAIST public notices + manual.json),
# parses them with OpenAI, stores them in Supabase and exports data/ggongbab/latest.json.
# Only the generated JSON is copied onto lab and main. Feature code is never merged by this job.

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes (GitHub may delay or skip individual runs)
  workflow_dispatch:
    inputs:
      mode:
        description: full, export-only, or review-report
        default: full
        type: choice
        options:
          - full
          - export-only
          - review-report

# Shares the group with content-refresh so two jobs never push generated data at the same time.
concurrency:
  group: babdoduk-content-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ggongbab.txt
      - name: Install dependencies
        run: pip install -r requirements-ggongbab.txt
      - name: Refresh ggongbab
        id: refresh
        env:
          DOORAY_API_TOKEN: ${{ secrets.DOORAY_API_TOKEN }}
          DOORAY_PROJECT_ID: ${{ vars.DOORAY_PROJECT_ID || '4424523215847914253' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # SUPABASE_SECRET_KEY wins; SUPABASE_SERVICE_ROLE_KEY is the legacy fallback.
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GGONGBAB_AI_MODEL: ${{ vars.GGONGBAB_AI_MODEL || 'gpt-5.6-luna' }}
          GGONGBAB_AI_FALLBACK_MODEL: ${{ vars.GGONGBAB_AI_FALLBACK_MODEL || 'gpt-5.6-terra' }}
          MODE: ${{ github.event.inputs.mode || 'full' }}
        run: |
          set +e
          case "$MODE" in
            export-only)   python scripts/refresh_ggongbab.py --export-only ;;
            review-report) python scripts/refresh_ggongbab.py --review-report; code=$?; echo "publish=0" >> "$GITHUB_OUTPUT"; exit "$code" ;;
            *)             python scripts/refresh_ggongbab.py ;;
          esac
          code=$?
          if [ "$code" -eq 2 ]; then
            echo "nothing safe to publish; keeping previous latest.json"
            echo "publish=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$code" -ne 0 ]; then
            echo "publish=0" >> "$GITHUB_OUTPUT"
            exit "$code"
          fi
          echo "publish=1" >> "$GITHUB_OUTPUT"
      - name: Validate generated JSON
        if: steps.refresh.outputs.publish == '1'
        run: python scripts/validate_content.py
      - name: Publish generated data to lab and main
        if: steps.refresh.outputs.publish == '1'
        env:
          GIT_TERMINAL_PROMPT: 0
        run: python scripts/publish_generated.py --paths data/ggongbab --message "ggongbab: event feed refresh"
