name: ggongbab-refresh

# Cron only runs from the default branch (main). Keep this file on main.
# Collects KAIST free-food events (Dooray tasks + KAIST public notices + manual.json),
# parses them with OpenAI, stores them in Supabase and exports data/ggongbab/latest.json.
# Only the generated JSON is copied onto lab and main. Feature code is never merged by this job.
#
# Recovery: the schedule is off until the check, dry-run and review-report modes
# have passed on main. The intended schedule is '*/30 * * * *' (a scheduled run
# is always a full refresh).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: >-
          check, dry-run and review-report never publish.
          export-only and full can commit data/ggongbab to lab and main.
        default: check
        type: choice
        options:
          - check
          - dry-run
          - review-report
          - export-only
          - full

# Shares the group with content-refresh so two jobs never push generated data at the same time.
concurrency:
  group: babdoduk-content-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # A scheduled run has no inputs, so it is a full refresh.
      MODE: ${{ github.event.inputs.mode || 'full' }}
    steps:
      - name: Check required configuration
        env:
          # Booleans only: this step never receives a secret value.
          HAS_DOORAY_API_TOKEN: ${{ secrets.DOORAY_API_TOKEN != '' }}
          HAS_SUPABASE_URL: ${{ secrets.SUPABASE_URL != '' }}
          HAS_SUPABASE_KEY: ${{ secrets.SUPABASE_SECRET_KEY != '' || secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
          HAS_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
        run: |
          # The runner falls back to an in-memory repository, or skips AI, when a
          # secret is missing and still exits 0, so a missing secret fails here.
          case "$MODE" in
            check|full)                need="DOORAY SUPABASE OPENAI" ;;
            dry-run)                   need="DOORAY" ;;
            review-report|export-only) need="SUPABASE" ;;
            *) echo "::error::unknown mode: $MODE"; exit 1 ;;
          esac
          missing=0
          report() {  # group, name, present
            if [ "$3" = "true" ]; then
              echo "$2: present"
            elif [[ " $need " == *" $1 "* ]]; then
              echo "::error::$2: missing (required by mode $MODE)"
              missing=1
            else
              echo "$2: missing (not used by mode $MODE)"
            fi
          }
          report DOORAY DOORAY_API_TOKEN "$HAS_DOORAY_API_TOKEN"
          report SUPABASE SUPABASE_URL "$HAS_SUPABASE_URL"
          report SUPABASE "SUPABASE_SECRET_KEY or legacy SUPABASE_SERVICE_ROLE_KEY" "$HAS_SUPABASE_KEY"
          report OPENAI OPENAI_API_KEY "$HAS_OPENAI_API_KEY"
          exit "$missing"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ggongbab.txt
      - name: Install dependencies
        run: pip install -r requirements-ggongbab.txt
      - name: Refresh ggongbab
        id: refresh
        env:
          DOORAY_API_TOKEN: ${{ secrets.DOORAY_API_TOKEN }}
          DOORAY_PROJECT_ID: ${{ vars.DOORAY_PROJECT_ID || '4424523215847914253' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # SUPABASE_SECRET_KEY wins; SUPABASE_SERVICE_ROLE_KEY is the legacy fallback.
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GGONGBAB_AI_MODEL: ${{ vars.GGONGBAB_AI_MODEL || 'gpt-5.6-luna' }}
          # Empty unless an operator sets the variable: the cron runs on the
          # primary model alone. An ambiguous mail becomes needs_review rather
          # than a guess from a model that costs ~10x per token.
          GGONGBAB_AI_FALLBACK_MODEL: ${{ vars.GGONGBAB_AI_FALLBACK_MODEL }}
        run: |
          set +e
          case "$MODE" in
            check)         python scripts/refresh_ggongbab.py --check ;;
            dry-run)       python scripts/refresh_ggongbab.py --dry-run ;;
            review-report)
              # Titles and review reasons can come from private sources, and this
              # repository's Actions logs are public: print the count and warnings only.
              python scripts/refresh_ggongbab.py --review-report > "$RUNNER_TEMP/review.txt"
              code=$?
              grep -E '^(review queue empty|[0-9]+ event\(s\) need review|\[(warn|error)\])' "$RUNNER_TEMP/review.txt"
              (exit "$code") ;;
            export-only)   python scripts/refresh_ggongbab.py --export-only ;;
            full)          python scripts/refresh_ggongbab.py ;;
            *)             echo "::error::unknown mode: $MODE"; false ;;
          esac
          code=$?
          # Only export-only and full may publish; any other mode ends with its own exit code.
          if [ "$MODE" != "export-only" ] && [ "$MODE" != "full" ]; then
            echo "publish=0" >> "$GITHUB_OUTPUT"
            exit "$code"
          fi
          if [ "$code" -eq 2 ]; then
            echo "::warning::nothing safe to publish (exit 2, reason above); keeping the previous latest.json"
            echo "publish=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$code" -ne 0 ]; then
            echo "publish=0" >> "$GITHUB_OUTPUT"
            exit "$code"
          fi
          echo "publish=1" >> "$GITHUB_OUTPUT"
      # Both steps check the mode as well as the output, so a diagnostic run
      # cannot reach the publisher even if the refresh script were wrong.
      - name: Validate generated JSON
        if: steps.refresh.outputs.publish == '1' && (env.MODE == 'export-only' || env.MODE == 'full')
        run: python scripts/validate_content.py
      - name: Publish generated data to lab and main
        if: steps.refresh.outputs.publish == '1' && (env.MODE == 'export-only' || env.MODE == 'full')
        env:
          GIT_TERMINAL_PROMPT: 0
        # A block scalar: as a plain scalar, the ": " inside the message is a YAML
        # mapping indicator and GitHub rejects the whole file.
        run: |
          python scripts/publish_generated.py --paths data/ggongbab --message "ggongbab: event feed refresh"
